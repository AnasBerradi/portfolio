<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Anas Films</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body">
  <div class="bg-glow bg-glow--1"></div>
  <div class="noise"></div>

  <!-- login view -->
  <div class="admin-panel" id="login-view" hidden>
    <h1>Admin</h1>
    <p class="admin-sub">Log in to manage your videos.</p>
    <form id="login-form">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required autofocus />
      </div>
      <button type="submit" class="btn" style="width:100%">Log in</button>
      <p class="admin-error" id="login-error"></p>
    </form>
    <a href="index.html" class="admin-view-site">← Back to site</a>
  </div>

  <!-- dashboard view -->
  <div class="admin-panel" id="dash-view" hidden>
    <div class="admin-row">
      <div>
        <h1>Your videos</h1>
        <p class="admin-sub" style="margin-bottom:0">Upload goes live instantly — no other steps.</p>
      </div>
      <button class="btn-link" id="logout-btn">Log out</button>
    </div>

    <form id="upload-form" style="margin-top:1.8rem">
      <div class="field">
        <label for="video">Video file (9:16 mp4 works best)</label>
        <input type="file" id="video" accept="video/*" required />
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Emerald Solitaire" required />
      </div>
      <div class="field">
        <label for="client">Brand / client (optional)</label>
        <input type="text" id="client" placeholder="e.g. Maison X" />
      </div>
      <div class="field">
        <label for="tag">Tag (optional)</label>
        <input type="text" id="tag" placeholder="e.g. Jewelry" />
      </div>
      <button type="submit" class="btn" id="upload-btn" style="width:100%">Upload video</button>
      <p class="admin-error" id="upload-error"></p>
      <p class="admin-ok" id="upload-ok"></p>
    </form>

    <div class="admin-list">
      <h2>Live on your site</h2>
      <div id="admin-items"></div>
    </div>

    <a href="index.html" class="admin-view-site">← View site</a>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
